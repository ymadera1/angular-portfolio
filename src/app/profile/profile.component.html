<!-- profile.component.html -->

<div class="profile">
  <img ngSrc="assets/profilePicture.jpg" alt="Yvonne Madera" width="auto" height="300" />
  <h2>{{ name }}</h2>
  <p>{{ role }}</p>
  <p>{{ location }}</p>
  <div class="social-links">
    <a class="social-button" 
    [href]="linkedinUrl" target="_blank">LinkedIn</a>
    <a class="social-button" [href]="githubUrl" target="_blank">GitHub</a>
  </div>
</div>
